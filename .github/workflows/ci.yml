name: quality-gate
on: [push, pull_request]

# 이 워크플로가 매 push 마다 보증하는 것: "얼린 스냅샷과 코드가 여전히 정합한가".
# 온톨로지를 최신으로 '갱신'하지 않는다 — baseline 이 움직이면 H1 의 before 가 재현되지 않는다.
# 스냅샷 갱신은 사람이 `make vendor` + MANIFEST 갱신으로만 한다 (data/MANIFEST.md).

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3

      # HermiT(L2 리즈너)는 JAR 이다 — Java 가 없으면 논리 일관성 검증을 못 한다.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check src tests scripts

      # 문서-정본 정합: 원고·README·DATASET-CARD 의 서명 수치가 CANONICAL-INDEX §1 과
      # 일치하는가 (문서판 L0 — 낡은 세대 서명이 '현재 값'으로 남으면 실패).
      - name: Signature drift check (docs vs CANONICAL-INDEX)
        run: uv run python scripts/check_signatures.py

      # 판정 문구 정합: 원고가 paper/verdicts.yaml(판정 SSOT)의 금지 문구를 쓰지 않는가.
      # 수치의 표류를 sig-check 가 막듯 판정 강도의 표류를 이것이 막는다 (CLAUDE.md §0.8).
      # **차단 모드** — PLAN-048 3단계 종료(2026-08-12)로 승격했다. 경고로 시작한 이유였던
      # 정본의 제목·서지 플레이스홀더가 그 단계에서 해소됐다 (CLAUDE.md §2.3).
      - name: Verdict wording check (manuscript vs verdicts.yaml)
        run: uv run python scripts/check_verdicts.py

      # 투고 파생본의 데스크 리젝 요인. 파생본이 아직 없으면 대상 부재로 통과.
      - name: Submission readiness check
        run: uv run python scripts/submission_check.py

      # 문체 규격 정합: 투고 파생본 계열이 paper/STYLE-KO-ACADEMIC.md 의 어체 규칙을
      # 지키는가 (S3 문장 길이 · T2 구어·은유 · T3 문두 접속어 · T5 주장 볼드).
      # 판정 강도의 표류를 verdicts 가 막듯 이것은 **어체의 표류**를 막는다.
      - name: Academic style check (submission derivative)
        run: uv run python scripts/style_check.py

      # 영문 문체 규격 정합 (paper/STYLE-EN-ACADEMIC.md). 한국어 규격이 어체의 표류를 막는
      # 자리에서 영문 원고의 같은 표류를 막는다 — 특히 판정 강도의 영문 관용구(§4)를 본다.
      # **경고 모드** — 영문 본문 번역이 끝나기 전이라 위반 0 이 아니다. 본문 완성 시점에
      # `--warn` 을 떼고 차단으로 승격한다 (한국어 규격이 밟은 경로 · CLAUDE.md §2.3).
      - name: Academic style check — English (warn)
        run: uv run python scripts/style_check_en.py

      # 용어 첫 등장 규율 (paper/glossary-terms.yaml · CLAUDE.md §8.1 V1·V2 · PLAN-066).
      # 어체를 style-check 가, 판정 강도를 verdicts 가 막는 자리에서 이것은 **정보 제시 순서**를
      # 막는다 — 절 재배치·supplementary 이관은 정의를 사용 뒤로 미는 부작용이 있고, 그 표류는
      # 재구성마다 재발했다. **차단 모드** — PLAN-066 DoD 3 충족(위반 25건 → 0)으로 2026-08-25
      # 승격하였다. G4(식별자 산문 사용)는 설계상 경고로 남는다.
      - name: Glossary first-mention check
        run: uv run python scripts/check_glossary.py

      # 단위 + 통합 테스트. 통합 테스트가 커밋된 스냅샷에서 baseline 을 재조립해
      # 관측 단위 수(Process 8 / SubProcess 12)·특허 0건·결정성·CQ 서명을 검증한다.
      - name: Unit + integration tests
        run: uv run pytest -q

      # 스냅샷 무결성: 커밋된 TTL 이 PROVENANCE 의 sha256 과 일치하는가.
      - name: Snapshot integrity (PROVENANCE sha256)
        run: uv run python -m sdkb_paper.ontology.vendor --verify

      # baseline(G₀ = 현행 SDKB) 재조립. SIRP 특허가 1,000건이 아니면 여기서 죽는다 —
      # before 가 움직이면 H1 이 재현되지 않는다.
      - name: Assemble baseline (graph_v0)
        run: uv run python -m sdkb_paper.ontology.baseline

      # L1 구조 제약 (SHACL). graph_v0 에는 완화 shape(레거시 특허 포함), mini_graph 에는
      # 엄격 shape(병합될 특허의 계약 — 개념 매핑 ≥1). 둘 다 있어야 게이트가 non-vacuous.
      - name: L1 SHACL gate
        run: |
          uv run python -m sdkb_paper.validate.shacl_gate data/processed/graph_v0.ttl --shapes graph
          uv run python -m sdkb_paper.validate.shacl_gate data/samples/mini_graph.ttl --shapes delta

      # L2 논리 일관성 (HermiT).
      - name: L2 reasoner gate (consistency)
        run: uv run python -m sdkb_paper.validate.reasoner_gate data/processed/graph_v0.ttl

      # L3 CQ. graph_v0 의 CQ 는 게이트가 아니라 논문 §4.2 의 G₀ 열을 만드는 **측정**이다
      # (--min-pass 0). 회귀 감시(특허 유실·공정 링크 단절)는 통합 테스트의 CQ 서명이 맡는다.
      - name: L3 competency questions
        run: |
          uv run python -m sdkb_paper.validate.cq_runner data/processed/graph_v0.ttl --report --min-pass 0
          uv run python -m sdkb_paper.validate.cq_runner data/samples/mini_graph.ttl --report

      # 게이트 리포트를 아티팩트로 남긴다 — 논문 §4.2 표의 원천.
      - name: Upload CQ reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cq-reports
          path: paper/figures/cq_report_*.md
          if-no-files-found: warn
