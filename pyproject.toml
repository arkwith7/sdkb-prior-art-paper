[project]
name = "sdkb-paper"
version = "0.1.0"
description = "SDKB augmentation with Samsung semiconductor patents — validation-gated ontology pipeline for the CHS7004 course paper"
requires-python = ">=3.11"
dependencies = [
    "rdflib>=7.0",
    "pyshacl>=0.26",
    "owlready2>=0.46",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "matplotlib>=3.8",
    "scipy>=1.12",
    "pyoxigraph>=0.5.9",
]

[project.optional-dependencies]
bq = ["google-cloud-bigquery>=3.19", "db-dtypes"]
dev = ["pytest>=8.0", "ruff>=0.4", "jupyter"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sdkb_paper"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
