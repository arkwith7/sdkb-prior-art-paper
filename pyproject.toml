[project]
name = "sdkb-paper"
version = "0.1.0"
description = "SDKB augmentation with Samsung semiconductor patents — validation-gated ontology pipeline for the CHS7004 course paper"
requires-python = ">=3.11"
dependencies = [
    "rdflib>=7.0",
    "pyshacl>=0.26",
    "owlready2>=0.46",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "matplotlib>=3.8",
    "scipy>=1.12",
    "pyoxigraph>=0.5.9",
    # 게이트 프로파일(profiles/*.yaml)의 로더가 쓴다. pyshacl 경유로 이미 깔려 있지만
    # **전이 의존에 기대면 상류가 끊을 때 게이트가 죽는다** — 프로파일은 게이트의 입력이다.
    "pyyaml>=6.0",
]

[project.optional-dependencies]
bq = ["google-cloud-bigquery>=3.19", "db-dtypes"]
# IR 검색 하네스 (PLAN-017 §8.4 · PLAN-018): BM25 nori + FAISS flat Dense + RRF.
# boto3 = Bedrock (Titan Embed v2 임베딩 · Haiku 4.5 질의 번역). faiss-cpu = flat 정확검색
# (40k×1024 밀리초 · ablation 오염 없음). GPU faiss는 40k 규모에 이득 미미 → CPU 정본.
ir = ["pyserini>=0.22", "faiss-cpu>=1.8", "boto3>=1.34", "kiwipiepy>=0.20"]

# 개발 도구는 PEP 735 dependency-group 이다 — `uv run`/`uv sync` 가 **자동으로** 넣는다.
# optional-dependencies("extra")에 두면 `uv run pytest` 가 pytest 를 못 찾는다(extra 는 명시
# 요청해야 설치됨). 실제로 `make test` 가 "Failed to spawn: pytest" 로 죽어 있었다(2026-07-31).
[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.4", "jupyter"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sdkb_paper"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
