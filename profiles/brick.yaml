# profiles/brick.yaml — 제2 도메인 프로파일 (EP5 · PLAN-064-prereg 의 전사)
#
# **이 파일은 설계하지 않는다 — 동결된 사전등록을 옮겨 적는다.** 값을 고치는 것은 프로파일
# 편집이 아니라 사전등록 변경이며, 그것은 §1-3 위반이다. sha256 핀은 손으로 적지 않고
# `PROVENANCE.json` 과 파일 실물에서 기계로 뽑았다(§1-1·§1-7).
#
# 뷰는 둘이다 — 고장탐지·진단(fdd)과 공간·구역 점유(space) + 공유 어휘(core).
# 에너지 계량 뷰는 **A-Box 가 받쳐 주지 않아** 제외됐다(사전등록 §2 · A-0 K3 실측).

name: brick

namespaces:
  brick: "https://brickschema.org/schema/Brick#"
bare_prefix: brick

cq_dir: queries/brick/cq
# Brick 은 배포 TTL 에 SHACL 이 내장돼 있다 — 디렉터리가 아니라 파일이다(사전등록 §3.2).
shapes_graph: data/external/brick/Brick-v1.4.4.ttl
shapes_delta: queries/brick/shapes/delta.ttl

# L3 = 주 태스크(fdd) · T3 = 타 태스크(space) + 공유 어휘(core) — 두 표면은 서로소다.
cq_suites: [fdd, space, core]
l3_suites: [fdd]
t3_suites: [space, core]

# 사이드카가 없다 — 조회 대상은 그래프 하나뿐이다.
cq_targets: [graph]
cq_gate_target: graph
# `core` 는 공유 어휘를 **의도적으로** 참조함을 헤더로 표기한다(사전등록 §3.1).
cq_extra_headers: [shared]

cq_monotone: [up, down, flat]
cq_tau: 0.05                  # 주값 (사전등록 §4.3)
cq_tau_grid: [0.0, 0.05, 0.10]

generation_dir: data/cq_generations/brick
graph_default: null           # D0…D5 는 인자로 받는다 (T-Box × 홀드아웃 A-Box)

# **T1·T2 는 이식하지 않는다** — 도메인별 태스크 벤치마크(정답·후보풀)가 없다.
# 그래서 판정 JSON 의 `accept` 는 null 이고 `Accept_partial` 이 별도 키로 남는다.
has_t1_t2: false

# L1 은 **기준 대비 신규 위반**으로 판정한다(SPEC-010 §6.2 · 승인 2026-08-22).
# 사전등록의 전사가 아니라 **계측기 결정**이다 — Brick 공식 예제는 무결한 상태에서도 Brick
# 자신의 shape 을 통과하지 않으므로(sh:Violation 293 실측) conforms 이진은 상수이고,
# 상수 게이트는 결함을 구분하지 못한다. 판정식(사전등록 §6.2)은 바뀌지 않는다.
l1_mode: relative

# 사전등록 §4.2 — `20260822 + 100·결함번호 + 반복번호`. **이 식에는 강도가 없다.**
seed_rule: linear
seed_base: 20260822
strengths: [0.05, 0.10, 0.20]
cross_fault_predicates: {}

faults:
  X2:
    number: 2
    kind: rate
    strengths: [0.05, 0.10, 0.20]
    reps: [1, 2, 3]
    prefix: brick
    predicates: [hasPart]
    options:
      label: "공간 포함관계 역전(교차·M)"
      expected: "T3(space·core)"
      # Building–Floor · Floor–Room 만 대상으로 한다(사전등록 §4.2).
      type_pairs: [[Building, Floor], [Floor, Room]]
  X3:
    number: 3
    kind: tier
    strengths: [1, 2, 3]
    reps: [1]               # 조작에 무작위 요소가 없어 반복이 정보를 더하지 않는다
    prefix: brick
    predicates: []
    options:
      label: "공유 관계 동치 오선언(교차·S)"
      expected: "T3(core·space)"
      tiers: [[feeds, hasPart], [isFedBy, isPartOf], [hasPoint, hasPart]]
  X4:
    number: 4
    kind: rate
    strengths: [0.05, 0.10, 0.20]
    reps: [1, 2, 3]
    prefix: brick
    predicates: [isLocationOf]
    options:
      label: "위치 재배선(교차·M)"
      expected: "T3(space·core)"
      # 행 수 불변이 가능하다 — T3 의 구성 타당도 **경계 사례**로 사전 지정됐다.
      boundary_case: true

# 봉인 대상 — 홀드아웃은 목록에 넣되 sha256 만 본다(열람이 아니다).
protected_config_attrs: []
protected_paths:
  - data/external/brick/*.ttl
  - queries/brick/cq/*.rq
  - queries/brick/shapes/delta.ttl

