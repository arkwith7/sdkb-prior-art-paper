# paper/word-budget.yaml — 장별 분량 예산 (PLAN-086 D13 · 2026-09-01)
#
# **왜 필요한가.** 분량 검사는 국문 D6 하나뿐이었고 그 임계는 문서 전체에 걸린 한 개의 수였다.
# 영문 단어수를 보는 검사는 아예 없었고, 그래서 PLAN-080 이 정한 상한 17,500 단어를 391 초과한
# 상태를 아무도 몰랐다(PLAN-086 §0.1). 또한 장 단위로는 어디가 늘었는지 보이지 않았으므로
# PLAN-083 종료 이후 +4,697자가 무신호로 늘었다.
#
# **이 예산은 경고다.** 초과하면 `make submission-check` 가 경고를 내고 통과시킨다. 편집 중에는
# 늘어나는 것이 정상이고, 차단해야 하는 것은 **모르는 사이에 늘어나는 것**이지 늘어나는 것 자체가
# 아니다. 차단은 D6(국문 총량) 하나가 계속 맡는다.
#
# **투고처 규정이 아니라 우리가 정한 편집 목표다**(CLAUDE.md "투고 대상 — 미정").
# 값은 PLAN-086 트랙 B 종료 시점의 실측에 여유 5 %를 더한 것이며, 손으로 늘리지 않는다.

meta:
  plan: PLAN-086
  measured_date: "2026-09-01"
