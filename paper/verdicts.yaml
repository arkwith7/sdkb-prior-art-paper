# paper/verdicts.yaml — 판정 단일 정본 (SSOT)
# 수정은 §1-2와 동급: 사용자 승인 커밋으로만. scripts/check_verdicts.py 가 이 파일을 읽어
# 원고(정본·파생본)의 판정 문구를 검사한다. PLAN-048 §0.8 문구 사전의 기계 정본.
#
# 라벨 정책 (§0.9 · 2026-08-15 개정 · 사용자 승인).
#   아래 verdicts 키(H3·H5·H2·T4·P0)는 **사전등록 라벨이며 record 는 불변이다.**
#   투고 파생본은 이 라벨을 본문에 쓰지 않고 서술형 호칭을 쓰므로(§0.9 규칙 2),
#   forbidden 패턴에 **서술형 변형을 함께 넣는다** — 라벨이 사라지면 라벨 기반 패턴이
#   파생본에서 눈이 멀기 때문이다. 즉 이 개정은 검사를 푼 것이 아니라 **좁아진 눈을 넓힌 것**이다.
#   파생본 호칭 ↔ 라벨 대응은 paper/supplementary/S6-preregistration-crosswalk.md 가 정본이다.

meta:
  plan: PLAN-048
  frozen_date: "2026-08-10"
  scan_targets:
    - paper/archive/논문_v0_9_SDKB_통합초안.md
    - paper/submission/**/*.md
    # 산문 소스 편입 (2026-08-22 · 사용자 승인 · PLAN-067 R-7).
    # **왜 넓히는가:** 파생본은 이 파일에서 조립되므로 대부분의 위반은 파생본에서 잡힌다.
    # 그러나 **조립에서 탈락하는 문장은 어느 검사도 보지 않는다** — `build_submission_stage3`
    # 의 행 선별(표 18행 → 10행 · 절제 17행 → 5행)과 축약이 그런 자리를 만든다. 소스에만
    # 남은 판정 서술은 다음 재조립에서 되살아날 수 있고, 그때는 아무도 그것이 언제 들어왔는지
    # 모른다. 검사 대상을 소스까지 넓히면 **위반이 파생본에 도달하기 전에** 잡힌다.
    # 편입 시점 실측: 위반 0 (6개 파일 통과) — 켜면서 고친 문장은 없다.
    - paper/manuscript/stage3_source.md
    # 보충자료 편입 (2026-08-29 · 사용자 승인). **왜 넓히는가:** 보충자료는 심사자에게 나가는
    # 자료인데 검사기 다섯이 전부 대상에서 제외하고 있었고, 그래서 두 세대 낡은 판정 서술과
    # 금지 문구가 그대로 살아남았다. 대상은 국문판뿐이다 — 금지 패턴이 한국어 문구이므로
    # 영문판에는 눈이 멀며, 영문 판정 강도는 STYLE-EN §4 가 맡는다.
    # **감사 기록 층(paper/audit/)은 대상이 아니다** — 기록된 시점의 문장 그대로여야 한다.
    - paper/supplementary/*.md
  # 헤더에 이 키워드가 있는 표는 통째로 면제한다. 두 표는 금지 문구와 경쟁 가설을
  # **나열하는 것이 임무**이므로(§0.4·§7.6 결론 규칙 표 · §7 경쟁 설명 분석표),
  # 검사기가 그 표의 내용을 위반으로 세면 표를 지우라는 요구가 된다.
  exempt_tables_with_header:
    - "금지되는 결론"
    - "가를 실험"

verdicts:
  H3:
    record:
      - { registration: PLAN-031, split: A, verdict: 부분지지 }
      - { registration: PLAN-047, split: B, verdict: 미지지 }
    composite_allowed:
      - "동시 충족은 두 분할에서 확인되지 않"
      - "깊은 회수.*(반복 관측|두 분할)"
    forbidden:
      - 'H3[는은]?\s*(전면\s*)?지지되'          # 합성으로 "지지" 단정 금지
      - '두 분할 모두.*부분\s*지지'              # A판정을 B에 전파 금지
      # 파생본 서술형 호칭 (§0.9 · 2026-08-15) — 라벨이 사라져도 금지는 남는다
      - '검색\s*유용성\s*점검[은는]?\s*(전면\s*)?지지되'
  H2:
    record:
      - { registration: v0.9, verdict: 미검정 }
      - { registration: PLAN-035, verdict: 기각(실검정 1회, 별도) }
    forbidden:
      - '게이트가.*안전(을|성을)\s*보장'
      - 'H2[는은]?\s*지지'
      # 파생본 서술형 호칭 (§0.9 · 2026-08-15)
      - '승인\s*안전성[은는]?\s*(확인|검증)됐'
  H5:
    record:
      - { registration: PLAN-031, split: A, verdict: 기각 }
      - { registration: PLAN-047, split: B, verdict: 재현되지 않음 }
    forbidden:
      - '동적\s*(태스크\s*)?결합의?\s*발견'      # PLAN-049 실측 전 승격 금지
      - '태스크\s*결합\(entanglement\)'          # 인과 표현 — "의존성"으로 완화(기존 결정)
  # EP5(제2 도메인 이식) — 금지 문구 여섯은 **결과 보기 전에** 박은 것이고(PLAN-064-prereg §0 ·
  # 발효 2026-08-22) 판정은 실행 뒤에 기록했다(2026-08-22 · SPEC-010 §8). 금지 목록은 판정
  # 기록으로 바뀌지 않았다 — 결과를 보고 금지를 고치면 그 목록은 사후에 만들어진 것이 된다.
  EP5:
    record:
      - { registration: PLAN-064-prereg, verdict: "절차 이식 · 결함 검출 미확증 (판정 가능 12건 · T3 단독 검출 0 · 위양성 0/30 · 계보 10판정 중 부분승인 2)" }
    forbidden:
      - 'T-gate\s*(전체|전반)[의가]?\s*도메인\s*(독립|비의존)'
      - '제2\s*도메인.*(비열등|성능\s*우위)'
      - '제2\s*도메인.*하위집단.*(비회귀|안전)'
      - 'DP[124].*(2도메인|두\s*도메인)\s*실증'
      - '승인된\s*변경.*사후\s*안전성[이은는]?\s*(확인|보장)'
      - '(A-Box|자원)\s*규모가\s*(SDKB|반도체).*비교\s*가능'
    # 키 이름을 `allowed` 에서 `composite_allowed` 로 고친다 — 검사기가 읽는 키는 후자이고,
    # 전자는 조용히 무시되어 허용 문구의 부재 알림이 한 번도 울리지 않았다(2026-08-22 실측).
    #
    # 둘째 항목은 판정 이후에 더한 **허용 서술**이다(사용자 승인 2026-08-22). 사전등록 §0 의
    # 허용 문구는 "동일 절차로 판정하였다"까지인데, 그 문장만으로는 X2 가 홀드아웃에서 공허했고
    # T3 단독 검출이 0 이었던 원인이 문구 사전에서 사라진다. 결함 명세가 개발 자원의 술어 방향에
    # 묶여 있었다는 사실은 판정의 해석에 필수이므로 허용 서술로 등재한다. **금지 여섯은 불변이다.**
    # 어휘는 문체 규격(§8.1 T2)에 맞춘다 — "계측기"·"재접지"는 원고에서 쓸 수 없는 낱말이라
    # 같은 뜻을 "결함 명세 · 모델링 관습 · 재정의"로 적는다.
    composite_allowed:
      - '형식\s*층과\s*교차\s*태스크\s*층에\s*한정'
      - '결함\s*명세[는은가이]?.*(모델링\s*관습|재정의)'
  T4:
    record:
      - { registration: PLAN-047, verdict: 판정 1회 실패(미확증) }
    forbidden:
      - '전달되지\s*않는다'                      # 허용형: "전달을 확증하지 못했다"
      - 'RAG\s*성능'
    exempt_line:
      # §6.2f 교차언어 진단의 "전달"은 T4(검색→생성)가 아니라 B5 의 비교우위가 융합
      # 시스템으로 옮겨가는지의 이야기다 — 같은 낱말, 다른 층. 동음이의 오탐.
      - '교차언어|영어 정답|영어 회수|비교우위'
  P0:
    record:
      - { registration: PLAN-031/047, verdict: 양 분할 비유의 }
    forbidden:
      - '주\s*시스템.*유의(하|미)?\s*개선'
  SYSTEM_LABELS:             # 구성 명칭 (§0.8 확장 · 2026-08-13)
    # 사전 지정 **주 구성은 P0★ 하나**다. P1 을 "주 시스템"이라 부르면 §0.3 조건 ②
    # (주 구성에서 유의)와 §6 의 부차 구성 개선이 한 이름 아래 섞여, 비유의 판정이
    # 유의 개선으로 읽힌다. P1 은 **부차 구성**이고, EP3 에서 자원을 갈아 끼운 대상일
    # 때는 **교체 대상 구성**이라 쓴다.
    forbidden:
      - 'P1[^|]{0,24}주\s*시스템'          # P1 을 주 시스템이라 부르는 것
      - '사전\s*지정\s*주\s*시스템'          # P0★ 는 "사전 지정 주 **구성**"으로 통일
  SEAL:                      # 봉인 개봉 서술 (§0.3 조건 ⑤ · 2026-08-13)
    # 열람 원장이 여러 행인데 "1회 개봉"을 단독으로 단정하면 감사 기록과 어긋난다.
    # 금지하는 것은 **낱말이 아니라 무자격 단정**이다 — 같은 행에서 원장을 함께
    # 밝히면 허용한다(§0.3 조건명으로 쓰는 경우가 여기 해당).
    #
    # **실측 교정 (2026-08-22 · PLAN-068 A-5b · 사용자 승인).** 구 record 는 "5행"이었다.
    # 그 값은 PLAN-031 A층 판독 시점의 기록이고, 현 원장(`data/processed/ir/seal_access.jsonl`)
    # 실물은 **25행**이다. **판정은 바뀌지 않는다** — 확증 실행의 횟수와 중단 2회는 그대로다.
    # 함께 밝혀야 하는 사실이 하나 더 있다: **25행은 전량 판독 B 봉인이고 A층 개봉은 원장에
    # 기록되지 않는다.** `analysis/metrics.py:52` 의 `qrel_path_for_split()` 이 `test_b` 에만
    # 봉인 경로를 주고 `test` 는 `QREL_EXAMINER` 를 직접 읽어 `open_sealed()` 를 지나지 않기
    # 때문이다. 그러므로 "모든 접근을 원장에 기록했다"는 **판독 B 에만 참이다**(배선 교정은
    # PLAN-068 트랙 C).
    record:
      - { registration: PLAN-031/047, verdict: "열람 원장 25행 — 전량 판독 B 봉인(sha 불변 · 2026-08-08~18 · 확증 계열 11 · 탐색적 명시 14) · 결과 산출 전 중단 2회 · A층 개봉은 원장 미기록(배선 결함)" }
    composite_allowed:
      - '열람\s*원장'
    forbidden:
      - '1\s*회\s*개봉'
    exempt_line:
      - '(열람\s*)?원장'
  CLAIM_STRENGTH:            # 주장 강도 전역 규칙 (§0.3 · §0.8)
    forbidden:
      - '자원\s*지표는\s*태스크\s*성능을\s*대표하지\s*않는다(?!,?\s*그럴 수)'  # 무조건 일반형
      - '효과가?\s*확실'                          # §0.3 5조건 미충족(현재 2/5)
      - 'FTO\s*위험을\s*줄'
      - '(조사|검토)\s*시간.*%\s*절감'
  PLACEHOLDERS:              # 데스크 리젝 요인 (submission-check와 중복 방어)
    # 이 라벨만 마스킹을 우회한다(원문 검사): 플레이스홀더는 백틱 안에 적히는 것이
    # **정상 표기**라, 언급 면제를 적용하면 전량이 보이지 않게 된다.
    scan_raw: true
    # **면제는 두지 않는다 (2026-08-29).** 착수 시점에는 S5 참고문헌의 미확정 서지 4건 때문에
    # `paper/supplementary/*.md` 를 면제하였으나, 그 목록이 조립 입력 층(`paper/assembly/`)으로
    # 옮겨 가면서 보충자료의 위반이 0 이 되었다. **면제는 필요가 사라지면 되돌린다** — 남겨 두면
    # 다음에 들어오는 진짜 위반이 조용히 통과한다.
    forbidden:
      - '\[서지 재확인 필요\]'
      - '\[실험 후 기입\]'
      - '\[최종 릴리스 후 기입\]'
      - '\[미확정 서지\]'
